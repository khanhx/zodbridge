name: Feature request
description: Propose a new capability or API
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the library doesn't support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the call site / signature you'd like.
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
